<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline | DA-ROS Church App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background-color: #0a0a0c;
      color: #f4f8fb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }
    .icon-box {
      width: 64px;
      height: 64px;
      background: rgba(220, 20, 60, 0.15);
      border: 1px solid rgba(220, 20, 60, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      color: #86868b;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .retry-btn {
      background: linear-gradient(135deg, #dc143c 0%, #b01030 100%);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 980px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(220, 20, 60, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .retry-btn:active {
      transform: scale(0.98);
    }
    .tips {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">⛪</div>
    <h1>You are Currently Offline</h1>
    <p>Please check your internet or Wi-Fi connection. Any previously viewed events and schedule pages are still accessible!</p>
    <button class="retry-btn" onclick="window.location.reload()">🔄 Retry Connection</button>
    <div class="tips">
      Tip: DA-ROS automatically saves previously viewed events so you can access them anytime without internet.
    </div>
  </div>
</body>
</html>
